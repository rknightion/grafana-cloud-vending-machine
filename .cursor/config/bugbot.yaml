version: 1
triggers:
  drafts: false
  frequency: everyPush
review:
  effort: smart
  smartPrompt: >-
    Use high effort for changes to platform/function/, platform/apis/,
    platform/provider/, platform/rbac/, deploy/, enabled/, or scripts/validate.sh,
    or for changes that affect external-resource identity, adoption, credential
    or access boundaries, admission policy, or what GitOps applies.
    Use low effort for documentation, backlog or tracker-only changes that
    preserve executable policy. Use default effort otherwise.
  incremental: true
prSummary:
  mode: comment
autofix:
  mode: disabled
