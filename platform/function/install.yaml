apiVersion: batch/v1
kind: Job
metadata:
  # A PreSync hook with a stable name, matching the provider's verification job.
  # The digest used to be part of the name, which meant a package bump silently
  # left the old job in place verifying the old digest; scripts/validate.sh now
  # asserts the digest below matches spec.package.
  name: verify-function-grafana-vending
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verify-function-grafana-vending
        app.kubernetes.io/part-of: grafana-cloud-vending-machine
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cosign
          image: ghcr.io/sigstore/cosign/cosign:v3.1.2@sha256:d91bc4e7e95e8d2f549c747a72dc174f90579e410a1695f57f686674f84ce849
          imagePullPolicy: IfNotPresent
          args:
            - verify
            - --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            - --certificate-identity=https://github.com/rknightion/grafana-cloud-vending-machine/.github/workflows/publish-function.yml@refs/heads/main
            - ghcr.io/rknightion/grafana-cloud-vending-machine/function-grafana-vending@sha256:ebb7ab2203d2846a5a954dabfc11a0d3fc70e2279b8017cd2f8e07b25b53a014
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-grafana-vending-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  deploymentTemplate:
    spec:
      replicas: 2
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
  # No serviceAccountTemplate.metadata.name here, deliberately. Crossplane names the
  # runtime ServiceAccount after the package *revision* unless the runtime config
  # supplies a name, and a supplied name is the one setting that makes the
  # ServiceAccount a single object shared by every revision of the package. Package
  # runtime objects are applied with server-side apply and ownerReferences is a
  # merge-keyed list, so on an upgrade that re-mints revisions the incoming revision's
  # controller reference merges alongside the outgoing one and the API server rejects
  # the object. crossplane/crossplane#7714 fixed that for the Service and the TLS
  # secrets; the ServiceAccount is still on the plain applicator. The failure is a full
  # outage: no runtime Deployment is created, so the pipeline fails closed and nothing
  # reconciles, deletions included. Nothing here references either ServiceAccount by
  # name, so there is nothing to gain by pinning one.
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-grafana-vending
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  package: ghcr.io/rknightion/grafana-cloud-vending-machine/function-grafana-vending@sha256:ebb7ab2203d2846a5a954dabfc11a0d3fc70e2279b8017cd2f8e07b25b53a014
  packagePullPolicy: IfNotPresent
  revisionActivationPolicy: Automatic
  revisionHistoryLimit: 1
  runtimeConfigRef:
    name: function-grafana-vending-runtime
