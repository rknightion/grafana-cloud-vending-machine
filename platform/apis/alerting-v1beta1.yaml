apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grafanaalertingbundles.platform.example.org
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: GrafanaAlertingBundle
    plural: grafanaalertingbundles
    singular: grafanaalertingbundle
    shortNames:
      - gcalerts
  defaultCompositionUpdatePolicy: Automatic
  enforcedCompositionRef:
    name: grafana-alerting-bundle-v1beta1
  versions:
    - name: v1beta1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: Stack-scoped Grafana alerting resources with explicit provenance and per-rule simplified routing.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - stackRef
                - provenance
              properties:
                stackRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 32
                      pattern: ^[a-z0-9]+$
                      description: GrafanaCloudStackRequest name and per-stack ProviderConfig name in this namespace.
                provenance:
                  type: string
                  enum:
                    - enforced
                    - createOnly
                  description: Required ownership decision. enforced locks Grafana UI edits with provisioning provenance; createOnly permits later UI edits and preserves them after creation.
                contactPoints:
                  type: array
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - email
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      email:
                        type: object
                        required:
                          - addresses
                        properties:
                          addresses:
                            type: array
                            minItems: 1
                            maxItems: 50
                            items:
                              type: string
                              minLength: 3
                              maxLength: 254
                          disableResolveMessage:
                            type: boolean
                          message:
                            type: string
                            maxLength: 4096
                          singleEmail:
                            type: boolean
                          subject:
                            type: string
                            maxLength: 4096
                muteTimings:
                  type: array
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      intervals:
                        type: array
                        maxItems: 50
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                messageTemplates:
                  type: array
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - template
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      template:
                        type: string
                        minLength: 1
                        maxLength: 16384
                inhibitionRules:
                  type: array
                  maxItems: 50
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - uid
                  items:
                    type: object
                    required:
                      - uid
                      - sourceMatchers
                      - targetMatchers
                    properties:
                      uid:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      equal:
                        type: array
                        maxItems: 20
                        items:
                          type: string
                          minLength: 1
                          maxLength: 190
                      sourceMatchers:
                        type: array
                        minItems: 1
                        maxItems: 50
                        items:
                          type: object
                          required:
                            - label
                            - type
                            - value
                          properties:
                            label:
                              type: string
                              minLength: 1
                              maxLength: 190
                            type:
                              type: string
                              enum:
                                - "="
                                - "!="
                                - "=~"
                                - "!~"
                            value:
                              type: string
                              maxLength: 1024
                      targetMatchers:
                        type: array
                        minItems: 1
                        maxItems: 50
                        items:
                          type: object
                          required:
                            - label
                            - type
                            - value
                          properties:
                            label:
                              type: string
                              minLength: 1
                              maxLength: 190
                            type:
                              type: string
                              enum:
                                - "="
                                - "!="
                                - "=~"
                                - "!~"
                            value:
                              type: string
                              maxLength: 1024
                ruleGroups:
                  type: array
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  items:
                    type: object
                    required:
                      - name
                      - folderUid
                      - rules
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      folderUid:
                        type: string
                        minLength: 1
                        maxLength: 190
                      intervalSeconds:
                        type: integer
                        minimum: 1
                        maximum: 86400
                      rules:
                        type: array
                        minItems: 1
                        maxItems: 100
                        items:
                          type: object
                          required:
                            - name
                            - condition
                            - data
                            - notificationSettings
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 190
                            uid:
                              type: string
                              maxLength: 190
                            condition:
                              type: string
                              minLength: 1
                              maxLength: 64
                            data:
                              type: array
                              minItems: 1
                              maxItems: 10
                              items:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                            annotations:
                              type: object
                              additionalProperties:
                                type: string
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                            noDataState:
                              type: string
                            execErrState:
                              type: string
                            for:
                              type: string
                            isPaused:
                              type: boolean
                            notificationSettings:
                              type: object
                              required:
                                - contactPoint
                              properties:
                                contactPoint:
                                  type: string
                                  minLength: 1
                                  maxLength: 63
                                groupBy:
                                  type: array
                                  maxItems: 20
                                  items:
                                    type: string
                                    minLength: 1
                                    maxLength: 190
                                groupInterval:
                                  type: string
                                groupWait:
                                  type: string
                                muteTimings:
                                  type: array
                                  maxItems: 20
                                  items:
                                    type: string
                                    minLength: 1
                                    maxLength: 63
                                repeatInterval:
                                  type: string
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grafana-alerting-bundle-v1beta1
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: GrafanaAlertingBundle
  mode: Pipeline
  pipeline:
    - step: render-grafana-alerting-bundle
      functionRef:
        name: function-grafana-vending
