apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grafanamls.platform.example.org
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: GrafanaML
    plural: grafanamls
    singular: grafanaml
    shortNames:
      - gcml
  defaultCompositionUpdatePolicy: Automatic
  enforcedCompositionRef:
    name: grafana-ml-v1beta1
  versions:
    - name: v1beta1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.stackRef.name
              message: metadata.name must match spec.stackRef.name so one composite owns this stack surface
            - rule: self.spec.stackRef == oldSelf.spec.stackRef
              message: stackRef is immutable after creation
          required: [spec]
          properties:
            spec:
              type: object
              required:
                - stackRef
                - profile
              properties:
                stackRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 32
                      pattern: ^[a-z0-9]+$
                      description: GrafanaCloudStackRequest name and per-stack ProviderConfig name in this namespace.
                profile:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: ^[a-z0-9-]+$
                  description: Selects a platform-owned ML profile. Requests cannot supply job, detector, holiday, datasource, model, or cap settings.
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grafana-ml-v1beta1
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: GrafanaML
  mode: Pipeline
  pipeline:
    - step: render-grafana-ml
      functionRef:
        name: function-grafana-vending
      input:
        apiVersion: platform.example.org/v1beta1
        kind: GrafanaVendingConfig
        spec:
          mlProfiles:
            - name: standard
              maxRunningResources: 2
              holidays:
                - name: example-holiday
                  description: Inert example holiday owned by the platform profile.
                  customPeriods:
                    - name: example-window
                      startTime: "2026-01-01T00:00:00Z"
                      endTime: "2026-01-02T00:00:00Z"
              jobs:
                - name: example-forecast
                  datasourceType: prometheus
                  datasourceUid: example-prometheus
                  metric: example_forecast
                  queryParams:
                    expr: up
                  holidayRefs:
                    - example-holiday
              outlierDetectors:
                - name: example-outlier-detector
                  datasourceType: prometheus
                  datasourceUid: example-prometheus
                  metric: example_outlier
                  queryParams:
                    expr: up
                  algorithm:
                    name: mad
                    sensitivity: 0.5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grafana-ml-profile-cap-v1beta1
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
  matchConstraints:
    resourceRules:
      - apiGroups:
          - platform.example.org
        apiVersions:
          - v1beta1
        operations:
          - CREATE
          - UPDATE
        resources:
          - grafanamls
  validations:
    - expression: 'params.spec.pipeline[0].input.spec.mlProfiles.exists(profile, profile.name == object.spec.profile && size(profile.jobs) + size(profile.outlierDetectors) <= profile.maxRunningResources)'
      message: selected ML profile exceeds its platform-owned maxRunningResources cap
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: grafana-ml-profile-cap-v1beta1
spec:
  policyName: grafana-ml-profile-cap-v1beta1
  validationActions:
    - Deny
  paramRef:
    name: grafana-ml-v1beta1
    parameterNotFoundAction: Deny
