apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grafanacloudstackrequests.platform.example.org
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: GrafanaCloudStackRequest
    plural: grafanacloudstackrequests
    singular: grafanacloudstackrequest
    shortNames:
      - gcstackrequest
  defaultCompositionUpdatePolicy: Automatic
  enforcedCompositionRef:
    name: grafana-cloud-stack-request-v1beta1
  versions:
    - name: v1beta1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: A request for a reconciled Grafana Cloud stack, baseline content, access, and optional platform features.
          required:
            - spec
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.slug
              message: metadata.name must match spec.slug
            - rule: self.spec.slug == oldSelf.spec.slug
              message: spec.slug is immutable
            - rule: self.spec.usage == oldSelf.spec.usage
              message: spec.usage is immutable
            - rule: self.spec.organization == oldSelf.spec.organization
              message: spec.organization is immutable
            - rule: self.spec.profile == oldSelf.spec.profile
              message: spec.profile is immutable
            - rule: '!self.spec.monthlyReport.enabled || (size(self.spec.monthlyReport.recipients) > 0 && size(self.spec.monthlyReport.replyTo) > 0)'
              message: enabled monthlyReport requires recipients and replyTo
            - rule: 'self.spec.sso.mode == "disabled" || size(self.spec.sso.profile) > 0'
              message: enabled or observed SSO requires a platform profile
            - rule: '!self.spec.incidentIntegration.enabled || size(self.spec.incidentIntegration.profile) > 0'
              message: enabled incidentIntegration requires a platform profile
          properties:
            spec:
              type: object
              required:
                - displayName
                - slug
                - region
                - usage
                - organization
              x-kubernetes-validations:
                - rule: "!has(self.scim)"
                  message: SCIM is out of scope; use external-group mapping
                - rule: has(self.retention) == has(oldSelf.retention)
                  message: retention must be selected at creation
                - rule: has(self.expiry) == has(oldSelf.expiry)
                  message: expiry must be selected at creation
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Human-readable Grafana Cloud stack name.
                slug:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: ^[a-z0-9]+$
                  description: Immutable Grafana Cloud stack slug and external identity.
                region:
                  type: string
                  pattern: ^prod-[a-z0-9-]+-[0-9]+$
                  description: Grafana Cloud region slug.
                usage:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: ^[a-z0-9-]+$
                  description: Generic usage classification and output-secret path segment.
                organization:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                  description: Immutable platform-owned key resolved through the organization registry.
                products:
                  type: object
                  default:
                    applicationObservability: false
                    kubernetesObservability: false
                    databaseObservability: false
                  properties:
                    applicationObservability:
                      type: boolean
                      default: false
                    kubernetesObservability:
                      type: boolean
                      default: false
                    databaseObservability:
                      type: boolean
                      default: false
                scim:
                  description: Rejected compatibility input; SCIM is outside the supported API.
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                retention:
                  type: object
                  required: [class]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: retention class is a creation-time decision
                  properties:
                    class:
                      type: string
                      minLength: 1
                      maxLength: 32
                      pattern: ^[a-z0-9-]+$
                      description: Platform-recognised durable fan-out class, not a retention period.
                expiry:
                  type: object
                  required: [expiresAt]
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.extensions) || has(self.extensions)"
                      message: extension history cannot be removed
                  properties:
                    expiresAt:
                      type: string
                      format: date-time
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: original expiry is immutable; append an extension instead
                    extensions:
                      type: array
                      default: []
                      maxItems: 100
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [recordedAt]
                      x-kubernetes-validations:
                        - rule: oldSelf.all(e, e in self)
                          message: extension records cannot be removed or changed
                      items:
                        type: object
                        required: [extendedTo, reason, requestedBy, recordedAt]
                        properties:
                          extendedTo:
                            type: string
                            format: date-time
                          reason:
                            type: string
                            minLength: 1
                            maxLength: 1024
                          requestedBy:
                            description: Declared requester; correlate with Kubernetes audit logs for authenticated actor provenance.
                            type: string
                            minLength: 1
                            maxLength: 128
                          recordedAt:
                            description: Declared recording time; Kubernetes audit logs provide the server timestamp.
                            type: string
                            format: date-time
                lifecycle:
                  type: object
                  default:
                    externalResources: Retain
                  properties:
                    externalResources:
                      type: string
                      default: Retain
                      enum:
                        - Retain
                        - Delete
                      description: Retains external resources by default; Delete requires a platform authorization bound to this request identity and profile.
                profile:
                  type: string
                  default: standard
                  minLength: 1
                  maxLength: 32
                  pattern: ^[a-z0-9-]+$
                  description: Platform-owned configuration profile selected by the request.
                changeReference:
                  type: string
                  maxLength: 128
                  description: Optional generic request or change reference published in the output document.
                configurationItemReference:
                  type: string
                  maxLength: 128
                  description: Optional generic configuration-item reference published in the output document.
                baselineDashboards:
                  type: object
                  default:
                    enabled: true
                  properties:
                    enabled:
                      type: boolean
                      default: true
                telemetryAccess:
                  type: object
                  default:
                    enabled: true
                  description: Creates a stack-scoped, rotating telemetry publisher access policy and mirrors its token to a derived AWS Secrets Manager path.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                plugins:
                  type: array
                  default: []
                  maxItems: 30
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - slug
                  description: Optional Grafana Cloud plugin installations owned by this stack request.
                  items:
                    type: object
                    required:
                      - slug
                    properties:
                      slug:
                        type: string
                        minLength: 1
                        maxLength: 128
                        pattern: ^[a-z0-9][a-z0-9-]*$
                      version:
                        type: string
                        default: latest
                        minLength: 1
                        maxLength: 64
                        pattern: ^[a-zA-Z0-9._+-]+$
                reconciliation:
                  type: object
                  default:
                    dashboards: createOnly
                    homePreference: createOnly
                  properties:
                    dashboards:
                      type: string
                      default: createOnly
                      enum:
                        - enforced
                        - createOnly
                    homePreference:
                      type: string
                      default: createOnly
                      enum:
                        - enforced
                        - createOnly
                sso:
                  type: object
                  default:
                    mode: disabled
                    profile: ""
                  properties:
                    mode:
                      type: string
                      default: disabled
                      enum:
                        - enforced
                        - createOnly
                        - observeOnly
                        - disabled
                    profile:
                      type: string
                      maxLength: 32
                      pattern: ^$|^[a-z0-9-]+$
                      description: Selects platform-owned SSO settings and a Secret reference; it cannot supply an endpoint or credential.
                monthlyReport:
                  type: object
                  default:
                    enabled: false
                    recipients: []
                    replyTo: ""
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    recipients:
                      type: array
                      maxItems: 20
                      items:
                        type: string
                        minLength: 3
                        maxLength: 254
                    replyTo:
                      type: string
                      maxLength: 254
                incidentIntegration:
                  type: object
                  default:
                    enabled: false
                    profile: ""
                    templateMode: createOnly
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    profile:
                      type: string
                      maxLength: 32
                      pattern: ^$|^[a-z0-9-]+$
                      description: Selects a platform-owned relay URL and Secret reference.
                    templateMode:
                      type: string
                      default: createOnly
                      enum:
                        - enforced
                        - createOnly
                      description: Controls whether Crossplane repairs or preserves later OnCall outgoing-webhook data-template edits.
            status:
              type: object
              properties:
                expiry:
                  type: object
                  properties:
                    effectiveExpiresAt:
                      type: string
                      format: date-time
                    expired:
                      type: boolean
                    warningActive:
                      type: boolean
                    deletionArmed:
                      type: boolean
                    deletionReady:
                      type: boolean
                    extensions:
                      type: array
                      items:
                        type: object
                        properties:
                          extendedTo:
                            type: string
                          reason:
                            type: string
                          requestedBy:
                            type: string
                          recordedAt:
                            type: string
                tokenExpiries:
                  type: object
                  properties:
                    administrator:
                      type: string
                    fleetManagement:
                      type: string
                    telemetryPublisher:
                      type: string
                deletionArmed:
                  type: boolean
                deletionReady:
                  type: boolean
                outputSecretPath:
                  type: string
                telemetrySecretPath:
                  type: string
                stack:
                  type: object
                  properties:
                    id:
                      type: string
                    url:
                      type: string
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grafana-cloud-stack-request-v1beta1
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: GrafanaCloudStackRequest
  mode: Pipeline
  pipeline:
    - step: render-grafana-vending-stack
      functionRef:
        name: function-grafana-vending
      input:
        apiVersion: platform.example.org/v1beta1
        kind: GrafanaVendingConfig
        spec:
          organizations:
            - name: example-primary
              providerConfigName: grafana-cloud-org-example-primary
              allowedRegions:
                - prod-us-central-0
              allowedUsages:
                - development
                - production
            - name: example-secondary
              providerConfigName: grafana-cloud-org-example-secondary
              allowedRegions:
                - prod-eu-west-0
              allowedUsages:
                - development
                - production
          maximumTokenLifetime: 720h
          tokenUseNetworkProfiles: []
          publicDashboardProfiles: []
          outputSecretPrefix: /platform/grafana-cloud/stacks
          secretStoreRef:
            name: grafana-vending-secrets
            kind: SecretStore
          deletionAuthorizations: []
          allowedUsages:
            - development
            - production
          ssoProfiles:
            - name: example-oidc
              providerName: generic_oauth
              oauth2Settings:
                name: Example SSO
                enabled: true
                allowSignUp: true
                authUrl: https://identity.example.com/oauth2/authorize
                tokenUrl: https://identity.example.com/oauth2/token
                apiUrl: https://identity.example.com/oauth2/userinfo
                clientId: grafana-example
                scopes: openid profile email
                emailAttributeName: email
                groupsAttributePath: groups
                roleAttributePath: contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'
                roleAttributeStrict: true
                clientSecretSecretRef:
                  name: grafana-sso-example-oidc
                  key: clientSecret
            - name: example-azuread
              providerName: azuread
              oauth2Settings:
                name: Example Azure AD
                enabled: true
                allowSignUp: true
                authUrl: https://login.microsoftonline.com/example-tenant-id/oauth2/v2.0/authorize
                tokenUrl: https://login.microsoftonline.com/example-tenant-id/oauth2/v2.0/token
                clientId: example-application-id
                scopes: openid email profile
                groupsAttributePath: groups
                roleAttributePath: contains(groups[*], 'example-grafana-admins') && 'Admin' || contains(groups[*], 'example-grafana-editors') && 'Editor' || 'Viewer'
                roleAttributeStrict: true
                clientSecretSecretRef:
                  name: grafana-sso-example-azuread
                  key: clientSecret
            - name: example-saml
              providerName: saml
              samlSettings:
                name: Example SAML
                enabled: true
                allowSignUp: true
                idpMetadataUrl: https://identity.example.com/saml/metadata
                assertionAttributeLogin: login
                assertionAttributeEmail: email
                assertionAttributeName: displayName
                assertionAttributeGroups: groups
                assertionAttributeRole: role
                roleValuesAdmin: Admin
                roleValuesEditor: Editor
                roleValuesViewer: Viewer
                roleValuesNone: None
                nameIdFormat: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
                signatureAlgorithm: rsa-sha256
          expiryPolicies:
            - usage: development
              warningBefore: 24h
              warningFolderUID: vending-home-folder
          incidentProfiles:
            - name: example-relay
              url: https://incident-relay.example.com/grafana/events
              authorizationSecretRef:
                name: grafana-incident-example-relay
                key: authorization
