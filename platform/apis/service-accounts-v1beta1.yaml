apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: grafanaserviceaccounts.platform.example.org
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: GrafanaServiceAccounts
    plural: grafanaserviceaccounts
    singular: grafanaserviceaccount
    shortNames: [gcsa]
  defaultCompositionUpdatePolicy: Automatic
  enforcedCompositionRef:
    name: grafana-service-accounts-v1beta1
  versions:
    - name: v1beta1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.stackRef.name
              message: metadata.name must match spec.stackRef.name so one composite owns this stack surface
            - rule: self.spec.stackRef == oldSelf.spec.stackRef
              message: stackRef is immutable after creation
          description: A platform-bounded set of rotating Grafana in-stack service accounts for one ready stack.
          required: [spec]
          properties:
            spec:
              type: object
              required: [stackRef, profile, accounts]
              x-kubernetes-validations:
                - rule: self.stackRef == oldSelf.stackRef
                  message: stackRef is immutable after creation
                - rule: self.profile == oldSelf.profile
                  message: profile is immutable after creation
              properties:
                stackRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 3
                      maxLength: 32
                      pattern: ^[a-z0-9]+$
                profile:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  description: A platform-owned profile that supplies the basic role, whole permission set, and requested token lifetime.
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 20
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  description: Account names only. Request authors cannot set roles, permissions, lifetimes, or token values.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 3
                        maxLength: 63
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
            status:
              type: object
              description: Read-only status owned by Crossplane. Token values are never written here.
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grafana-service-accounts-v1beta1
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: GrafanaServiceAccounts
  mode: Pipeline
  pipeline:
    - step: render-grafana-service-accounts
      functionRef:
        name: function-grafana-vending
      input:
        apiVersion: platform.example.org/v1beta1
        kind: GrafanaVendingConfig
        spec:
          maximumTokenLifetime: 720h
          secretStoreRef:
            name: grafana-vending-secrets
            kind: SecretStore
          serviceAccountProfiles:
            - name: ci
              role: Viewer
              tokenLifetime: 168h
              permissions: []
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: grafana-service-accounts-token-ceiling
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
  matchConstraints:
    resourceRules:
      - apiGroups: [platform.example.org]
        apiVersions: [v1beta1]
        operations: [CREATE, UPDATE]
        resources: [grafanaserviceaccounts]
        scope: Namespaced
  validations:
    - expression: params.spec.pipeline.exists(step, step.input.kind == 'GrafanaVendingConfig' && step.input.spec.serviceAccountProfiles.exists(profile, profile.name == object.spec.profile))
      message: service account profile is not configured by the enforced Composition
    - expression: params.spec.pipeline.exists(step, step.input.kind == 'GrafanaVendingConfig' && step.input.spec.serviceAccountProfiles.exists(profile, profile.name == object.spec.profile && duration(profile.tokenLifetime) <= duration(step.input.spec.maximumTokenLifetime)))
      message: service account profile token lifetime exceeds the platform maximumTokenLifetime
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: grafana-service-accounts-token-ceiling
spec:
  policyName: grafana-service-accounts-token-ceiling
  validationActions: [Deny]
  paramRef:
    name: grafana-service-accounts-v1beta1
    parameterNotFoundAction: Deny
