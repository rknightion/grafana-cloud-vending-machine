apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: grafana-content-access-policy-v1beta1
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1beta1
    kind: GrafanaContentAccessPolicy
  mode: Pipeline
  pipeline:
    - step: render-grafana-content-access-policy
      functionRef:
        name: function-grafana-vending
