<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviewed decommission lifecycle</title>
  <style>
    /* Fonts are served by the docs site itself. A Google Fonts <link> here
       would make every visitor's browser fetch a third-party subresource,
       which the hub's check_external_resources.py guard rejects outright. */
    @font-face {
      font-family: "Hanken Grotesk";
      src: url("../fonts/hanken-grotesk-latin.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("../fonts/JetBrainsMono-Variable.woff2") format("woff2-variations");
      font-weight: 100 800; font-style: normal; font-display: swap;
    }
  </style>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f5f5f5; color: #2d3142; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    .frame { width: min(1200px, 100%); margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 11px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font: 400 clamp(28px, 4vw, 40px) 'Hanken Grotesk', system-ui, sans-serif; letter-spacing: -.02em; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Lifecycle phase map · doc-wide · engineer</p>
    <h1>Reviewed decommission lifecycle</h1>
    <svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decommission-lifecycle-title decommission-lifecycle-desc">
      <title id="decommission-lifecycle-title">Reviewed decommission lifecycle</title>
      <desc id="decommission-lifecycle-desc">State diagram showing the retain-default exit and the separately reviewed deletion stages. Git Sync credential decommission is platform-authorized, removes the Connection before the Securevalue, and records completion through claim status instead of inferred child disappearance.</desc>
      <defs>
        <marker id="decommission-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="decommission-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="680" fill="#f5f5f5"/>

      <rect x="40" y="204" width="1200" height="180" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)" stroke-dasharray="4,4"/>
      <rect x="56" y="212" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="64" y="224" fill="#7a8399" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".14em">REVIEWED STAGES</text>
      <rect x="368" y="412" width="344" height="140" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)" stroke-dasharray="4,4"/>
      <rect x="384" y="420" width="136" height="16" rx="2" fill="#f5f5f5"/>
      <text x="392" y="432" fill="#7a8399" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".14em">WAIT FOR EVIDENCE</text>
      <rect x="48" y="48" width="232" height="104" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)" stroke-dasharray="4,4"/>
      <rect x="64" y="56" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="72" y="68" fill="#7a8399" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".14em">DEFAULT EXIT</text>

      <path d="M64 300 H80" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#decommission-lifecycle-arrow)"/>
      <path d="M240 300 H320" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#decommission-lifecycle-arrow-accent)"/>

      <path d="M1040 300 H1096" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#decommission-lifecycle-arrow)"/>
      <path d="M1240 300 H1252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#decommission-lifecycle-arrow)"/>
      <path d="M160 256 V176 Q160 168 168 168 H208 Q216 168 216 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#decommission-lifecycle-arrow)"/>

      <rect x="256" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="281" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">REVIEW 1</text>
      <rect x="424" y="356" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="365" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">ARMED, NOT DELETED</text>
      <rect x="692" y="356" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="365" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">READY TRUE</text>
      <rect x="828" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="852" y="281" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">REVIEW 2</text>
      <rect x="1052" y="272" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1076" y="281" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">REVIEW 3</text>
      <rect x="48" y="164" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="173" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">PRUNE UNARMED</text>

      <circle cx="56" cy="300" r="6" fill="#2d3142"/>
      <rect x="80" y="256" width="160" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="80" y="256" width="160" height="88" rx="8" fill="#fff" stroke="#2d3142"/>
      <rect x="92" y="268" width="48" height="12" rx="2" fill="none" stroke="#4f5d75"/>
      <text x="116" y="277" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">REQUEST</text>
      <text x="160" y="302" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Request active</text>
      <text x="160" y="320" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Retain by default</text>

      <rect x="320" y="256" width="160" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="256" width="160" height="88" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <rect x="332" y="268" width="40" height="12" rx="2" fill="none" stroke="#eb6c36"/>
      <text x="352" y="277" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">INTENT</text>
      <text x="400" y="302" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Arm Delete</text>
      <text x="400" y="320" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">exact authorization</text>

      <rect x="532" y="440" width="80" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="532" y="440" width="80" height="88" rx="8" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.45)"/>
      <rect x="544" y="452" width="24" height="12" rx="2" fill="none" stroke="#4f5d75"/>
      <text x="556" y="461" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">WAIT</text>
      <text x="572" y="486" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Evidence</text>
      <text x="572" y="504" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">observed state</text>

      <rect x="664" y="256" width="160" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="664" y="256" width="160" height="88" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <rect x="676" y="268" width="40" height="12" rx="2" fill="none" stroke="#eb6c36"/>
      <text x="696" y="277" fill="#eb6c36" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">READY</text>
      <text x="744" y="302" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Deletion ready</text>
      <text x="744" y="320" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">both conditions observed</text>

      <rect x="880" y="256" width="160" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="880" y="256" width="160" height="88" rx="8" fill="#fff" stroke="#2d3142"/>
      <rect x="892" y="268" width="40" height="12" rx="2" fill="none" stroke="#4f5d75"/>
      <text x="912" y="277" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">CLAIMS</text>
      <text x="960" y="302" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Clear access claims</text>
      <text x="960" y="320" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">objects and finalizers gone</text>

      <rect x="1096" y="256" width="144" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="1096" y="256" width="144" height="88" rx="8" fill="#fff" stroke="#2d3142"/>
      <rect x="1108" y="268" width="48" height="12" rx="2" fill="none" stroke="#4f5d75"/>
      <text x="1132" y="277" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">REQUEST</text>
      <text x="1168" y="302" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remove from Git</text>
      <text x="1168" y="320" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">armed deletion</text>

      <circle cx="1260" cy="300" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="1260" cy="300" r="5" fill="#2d3142"/>
      <text x="1260" y="326" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">DELETE</text>

      <circle cx="216" cy="104" r="8" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <circle cx="216" cy="104" r="5" fill="#4f5d75"/>
      <text x="216" y="126" fill="#2d3142" font-family="'Hanken Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">External state retained</text>
      <text x="216" y="142" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">Stack-local content is orphaned</text>

      <text x="368" y="542" fill="#4f5d75" font-family="'Hanken Grotesk', system-ui, sans-serif" font-size="11" font-style="italic">
        <tspan x="368" y="542">Readiness: observed deleteProtection=false; ESO finalizes and syncs current-generation PushSecrets.</tspan>
        <tspan x="368" y="558">Git Sync retains its external Connection and Securevalue by default.</tspan>
        <tspan x="368" y="574">An authorized Delete removes Connection before Securevalue;</tspan>
        <tspan x="368" y="590">status.decommission.phase records Armed through Complete from observed child state.</tspan>
      </text>
      <line x1="40" y1="620" x2="1240" y2="620" stroke="rgba(45,49,66,.15)"/>
      <text x="40" y="646" fill="#4f5d75" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing=".14em">SCOPE</text>
      <rect x="112" y="636" width="12" height="12" rx="2" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="136" y="646" fill="#4f5d75" font-family="'Hanken Grotesk', sans-serif" font-size="10">review boundary</text>
      <rect x="304" y="636" width="12" height="12" rx="2" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.45)"/>
      <text x="328" y="646" fill="#4f5d75" font-family="'Hanken Grotesk', sans-serif" font-size="10">wait for observed evidence</text>
      <text x="632" y="646" fill="#4f5d75" font-family="'Hanken Grotesk', sans-serif" font-size="10">Delete covers the Stack and credential output documents, not stack-local Grafana content.</text>
    </svg>
  </main>
</body>
</html>
