      #d-07-alerting-response-root .section { padding:44px 0;border-top:1px solid #d7dade;margin-top:24px }
      #d-07-alerting-response-root .diagram-container { overflow-x:auto;width:100%;margin:24px 0 18px;border-top:1px solid #d7dade;border-bottom:1px solid #d7dade }
      #d-07-alerting-response-root .note { border-left:3px solid #b33b14;padding:10px 18px;max-width:1200px;background:#fff6ef;font-size:14px }
      #d-07-alerting-response-root .sources { font-size:13px;color:#626871 }
      #d-07-alerting-response-root .toc { display:grid;grid-template-columns:1fr 1.2fr;gap:0 36px;margin:32px 0 }
      #d-07-alerting-response-root .toc a { padding:16px 0;border-top:1px solid #d7dade;text-decoration:none;color:#22252b;display:flex;gap:20px }
