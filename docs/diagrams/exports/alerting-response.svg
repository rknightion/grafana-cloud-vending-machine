      #d-07-alerting-response-root code { font:12px "Geist Mono",monospace;background:#f3f4f6;padding:2px 3px }
      #d-07-alerting-response-root .table-scroll table { min-width:1180px }
      #d-07-alerting-response-root details { padding:16px 0 }
      #d-07-alerting-response-root summary { font-weight:600;cursor:pointer }
      @media(max-width:720px) {
#d-07-alerting-response-root .toc, #d-07-alerting-response-root .grid { grid-template-columns:1fr }
}
      @media print {
#d-07-alerting-response-root .diagram-container { overflow-x:visible }
