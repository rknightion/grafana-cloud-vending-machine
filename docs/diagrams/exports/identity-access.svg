      #d-04-identity-access-root code { font:12px "Geist Mono",monospace;background:#f3f4f6;padding:2px 3px }
      #d-04-identity-access-root .table-scroll table { min-width:1180px }
      #d-04-identity-access-root details { padding:16px 0 }
      #d-04-identity-access-root summary { font-weight:600;cursor:pointer }
      @media(max-width:720px) {
#d-04-identity-access-root .toc, #d-04-identity-access-root .grid { grid-template-columns:1fr }
}
      @media print {
#d-04-identity-access-root .diagram-container { overflow-x:visible }
      #d-04-identity-access-root .section { break-before:page }
      #d-04-identity-access-root .toc { display:none }
}</style><marker id="d-04-identity-access-04-identity-access-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#626871"/></marker><marker id="d-04-identity-access-04-identity-access-ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2459a6"/></marker></defs><rect width="1840" height="1280" fill="#fff"/><text x="48" y="48" text-anchor="start" fill="#626871" font-family="Geist Mono, monospace" font-size="14" font-weight="600">UK MARKET / IDENTITY AND AUTHORIZATION</text>
