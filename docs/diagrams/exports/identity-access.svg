<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 1280" role="img" aria-labelledby="04-identity-access-title 04-identity-access-desc" id="d-04-identity-access-root"><title id="04-identity-access-title">Market identity and access</title><desc id="04-identity-access-desc">SSO maps identity and claims. Teams participate in role assignments, content ACLs and data-source policies in parallel. A user query then follows the permitted data path.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-identity-access-root { color: #22252b; }
      #d-04-identity-access-root body.figure main { max-width:none }
