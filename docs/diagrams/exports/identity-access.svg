      #d-04-identity-access-root a { color:#2459a6;text-underline-offset:3px }
      #d-04-identity-access-root a:focus-visible { outline:3px solid #b33b14;outline-offset:4px }
      #d-04-identity-access-root .status { display:inline-block;padding:5px 9px;border:1px solid #b33b14;color:#9e3412;font-size:12px }
      #d-04-identity-access-root .section { padding:44px 0;border-top:1px solid #d7dade;margin-top:24px }
      #d-04-identity-access-root .diagram-container { overflow-x:auto;width:100%;margin:24px 0 18px;border-top:1px solid #d7dade;border-bottom:1px solid #d7dade }
      #d-04-identity-access-root .note { border-left:3px solid #b33b14;padding:10px 18px;max-width:1200px;background:#fff6ef;font-size:14px }
      #d-04-identity-access-root .sources { font-size:13px;color:#626871 }
      #d-04-identity-access-root .toc { display:grid;grid-template-columns:1fr 1.2fr;gap:0 36px;margin:32px 0 }
      #d-04-identity-access-root .toc a { padding:16px 0;border-top:1px solid #d7dade;text-decoration:none;color:#22252b;display:flex;gap:20px }
      #d-04-identity-access-root .toc b { font:15px "Geist Mono",monospace;color:#9e3412 }
      #d-04-identity-access-root .toc small { color:#626871;display:block }
      #d-04-identity-access-root .grid { display:grid;grid-template-columns:1.2fr 1fr;gap:36px }
      #d-04-identity-access-root .table-scroll { overflow-x:auto;margin:24px 0 }
