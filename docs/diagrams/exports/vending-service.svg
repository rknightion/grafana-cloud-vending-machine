      #d-01-vending-service-root code { font:12px "Geist Mono",monospace;background:#f3f4f6;padding:2px 3px }
      #d-01-vending-service-root .table-scroll table { min-width:1180px }
      #d-01-vending-service-root details { padding:16px 0 }
