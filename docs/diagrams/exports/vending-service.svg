<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="01-vending-service-title 01-vending-service-desc" id="d-01-vending-service-root"><title id="01-vending-service-title">Grafana Cloud vending service</title><desc id="01-vending-service-desc">The platform owns a repeatable service definition. A request selects a market and its required capabilities; the delivery engine configures the stack and exposes an operating contract.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-vending-service-root { color: #22252b; }
      #d-01-vending-service-root body.figure main { max-width:none }
      #d-01-vending-service-root .eyebrow, #d-01-vending-service-root .meta { font:12px/1.5 "Geist Mono",monospace;letter-spacing:.05em;color:#626871 }
