      @media(max-width:720px) {
#d-01-vending-service-root .toc, #d-01-vending-service-root .grid { grid-template-columns:1fr }
}
      @media print {
#d-01-vending-service-root .diagram-container { overflow-x:visible }
      #d-01-vending-service-root .section { break-before:page }
