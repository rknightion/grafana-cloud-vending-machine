"88" y="352" width="368" height="184" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="108" y="380" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">ALLOW ACTION</text><text x="108" y="412" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">RBAC + content permissions</text><text x="108" y="440" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Which actions and resources?</text><text x="108" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">View NOC folder; edit RAN content</text><text x="108" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Data source Query permission</text></g><g><rect x="536" y="352" width="272" height="184" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="556" y="380" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">FILTER DATA</text><text x="556" y="412" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">LBAC policy</text><text x="556" y="440" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Which data within a source?</text><text x="556" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">market=&quot;uk&quot;</text><text x="556" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">domain=&quot;ran&quot;</text></g><g><rect x="888" y="352" width="304" height="184" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="908" y="380" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">QUERY RESULT</text><text x="908" y="412" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Supported data source</text><text x="908" y="440" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Loki or Cloud Metrics</text><text x="908" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Only matching labelled data</text><text x="908" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Cloud Traces: preview, separate</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Arrows show identity and query-policy dependencies; this is a conceptual access model, not HTTP message timing.</text></svg>
