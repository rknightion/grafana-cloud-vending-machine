<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="05-market-access-title 05-market-access-desc" id="d-05-market-access-root"><title id="05-market-access-title">SSO, RBAC and LBAC solve different problems</title><desc id="05-market-access-desc">Authenticate a person, map their groups to market teams, grant actions and content access, then apply data filters on the supported data-source query path.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-05-market-access-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-05-market-access-root a { color:#2459a6;text-underline-offset:3px }
      #d-05-market-access-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-05-market-access-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-05-market-access-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-05-market-access-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-05-market-access-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-05-market-access-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-05-market-access-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-05-market-access-root .toc small { display:block;color:#62666e }
      #d-05-market-access-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-05-market-access-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-05-market-access-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-05-market-access-root .sources { font-size:13px;color:#62666e }
      #d-05-market-access-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-05-market-access-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-05-market-access-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-05-market-access-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-05-market-access-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-05-market-access-root td, #d-05-market-access-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-05-market-access-root td code { font-size:12px }
      #d-05-market-access-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-05-market-access-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-05-market-access-root .table-scroll table { min-width:1040px }
      #d-05-market-access-root ul { padding-left:20px }
      #d-05-market-access-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-05-market-access-root .toc, #d-05-market-access-root .split { grid-template-columns:1fr }
      #d-05-market-access-root .lead { font-size:18px }
}
      @media print {
#d-05-market-access-root .diagram-container { overflow-x:visible;border:0 }
      #d-05-market-access-root .section { break-before:page }
      #d-05-market-access-root .toc { display:none }
      #d-05-market-access-root a { color:inherit }
}</style><marker id="d-05-market-access-05-market-access-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-05-market-access-05-market-access-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-05-market-access-05-market-access-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><rect x="40" y="40" width="1200" height="572" rx="8" fill="#f7f8f9" stroke="#dedfe2"/><text x="60" y="68" fill="#62666e" font-family="Geist Mono, monospace" font-size="12" font-weight="500">ONE MARKET STACK / EXAMPLE: UK</text><path d="M 312 160 L 440 160" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-05-market-access-05-market-access-arrow)"/><rect x="326.0" y="126" width="100" height="20" fill="#fff"/><text x="376" y="140" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">AUTHENTICATE</text><path d="M 728 160 L 856 160" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-05-market-access-05-market-access-arrow)"/><rect x="749.0" y="126" width="86" height="20" fill="#fff"/><text x="792" y="140" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">MAP GROUPS</text><path d="M 952 224 V 280 Q 952 288 944 288 H 280 Q 272 288 272 296 V 352" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-05-market-access-05-market-access-arrow)"/><path d="M 1048 224 V 312 Q 1048 320 1040 320 H 680 Q 672 320 672 328 V 352" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-05-market-access-05-market-access-arrow)"/><path d="M 456 432 L 536 432" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-05-market-access-05-market-access-arrow)"