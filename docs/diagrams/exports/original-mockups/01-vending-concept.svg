<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="01-vending-concept-title 01-vending-concept-desc" id="d-01-vending-concept-root"><title id="01-vending-concept-title">Vend a usable service, not an empty stack</title><desc id="01-vending-concept-desc">Teams request an observability environment. A platform-owned recipe turns that request into a configured Grafana Cloud stack and a clear operating contract.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-01-vending-concept-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-01-vending-concept-root a { color:#2459a6;text-underline-offset:3px }
      #d-01-vending-concept-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-01-vending-concept-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-01-vending-concept-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-01-vending-concept-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-01-vending-concept-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-01-vending-concept-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-01-vending-concept-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-01-vending-concept-root .toc small { display:block;color:#62666e }
      #d-01-vending-concept-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-01-vending-concept-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-01-vending-concept-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-01-vending-concept-root .sources { font-size:13px;color:#62666e }
      #d-01-vending-concept-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-01-vending-concept-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-01-vending-concept-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-01-vending-concept-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-01-vending-concept-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-01-vending-concept-root td, #d-01-vending-concept-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-01-vending-concept-root td code { font-size:12px }
      #d-01-vending-concept-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-01-vending-concept-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-01-vending-concept-root .table-scroll table { min-width:1040px }
      #d-01-vending-concept-root ul { padding-left:20px }
      #d-01-vending-concept-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-01-vending-concept-root .toc, #d-01-vending-concept-root .split { grid-template-columns:1fr }
      #d-01-vending-concept-root .lead { font-size:18px }
}
      @media print {
#d-01-vending-concept-root .diagram-container { overflow-x:visible;border:0 }
      #d-01-vending-concept-root .section { break-before:page }
      #d-01-vending-concept-root .toc { display:none }
      #d-01-vending-concept-root a { color:inherit }
}</style><marker id="d-01-vending-concept-01-vending-concept-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-01-vending-concept-01-vending-concept-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-01-vending-concept-01-vending-concept-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="64" y="56" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">A REPEATABLE OBSERVABILITY SERVICE, WITH CONTROLLED VARIATION</text><path d="M 328 160 H 376 Q 384 160 384 168 V 272 Q 384 280 392 280 H 440" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-01-vending-concept-01-vending-concept-arrow)"/><path d="M 328 336 L 440 336" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-01-vending-concept-01-vending-concept-arrow)"/><path d="M 328 512 H 400 Q 408 512 408 504 V 392 Q 408 384 416 384 H 440" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-01-vending-concept-01-vending-concept-arrow)"/><path d="M 760 336 L 888 336" fill="none" stroke="#2459a6" stroke-width="1.5"  marker-end="url(#d-01-vending-concept-01-vending-concept-arrow-link)"/><rect x="784.5" y="302" width="79" height="20" fill="#fff"/><text x="824" y="316" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">PROVISION</text><path d="M 1056 432 V 552 Q 1056 560 1048 560 H 608 Q 600 560 600 552 V 432" fill="none" stroke="#62666e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#d-01-vending-concept-01-vending-concept-arrow)"/><rect x="784.0" y="530" width="72" height="20" fill="#fff"/><text x="820" y="544" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">MAINTAIN</text><g><rect x="64" y="96" width="264" height="128" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="84" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">PLATFORM</text><text x="84" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Shared baseline</text><text x="84" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Approved defaults</text><text x="84" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Versions, limits, controls</text></g><g><rect x="64" y="272" width="264" height="128" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="84" y="300" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">TEAM</text><text x="84" y="332" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Service request</text><text x="84" y="360" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Owner, market, region</text><text x="84" y="384" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Selected capabilities</text></g><g><rect x="64" y="448" width="264" height="128" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="84" y="476" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">VARIATION</text><text x="84" y="508" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Market profile</text><text x="84" y="536" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Identity, teams, content</text><text x="84" y="560" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Data and routing policy</text></g><g><rect x="440" y="240" width="320" height="192" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="460" y="268" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">SERVICE CONTRACT</text><text x="460" y="300" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Vending machine</text><text x="460" y="328" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Validate the request</text><text x="460" y="352" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Apply the approved recipe</text><text x="460" y="376" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Report outcome and ownership</text></g><g><rect x="888" y="240" width="328" height="192" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="908" y="268" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">PRODUCT</text><text x="908" y="300" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Grafana Cloud stack</text><text x="908" y="328" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Identity and access configured</text><text x="908" y="352" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Starter content and integrations</text><text x="908" y="376" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Endpoints + secure handoff</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Solid arrows: requested change or dependency. Dashed arrows: observation or ongoing operation.</text></svg>
