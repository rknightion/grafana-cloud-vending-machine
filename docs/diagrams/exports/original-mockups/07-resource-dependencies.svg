<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="07-resource-dependencies-title 07-resource-dependencies-desc" id="d-07-resource-dependencies-root"><title id="07-resource-dependencies-title">One request expands into a dependency graph</title><desc id="07-resource-dependencies-desc">The core renderer creates a stack, bootstrap account and credential chains. Stack-local content and optional modules become eligible as their observed prerequisites are satisfied.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-07-resource-dependencies-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-07-resource-dependencies-root a { color:#2459a6;text-underline-offset:3px }
      #d-07-resource-dependencies-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-07-resource-dependencies-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-07-resource-dependencies-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-07-resource-dependencies-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-07-resource-dependencies-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-07-resource-dependencies-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-07-resource-dependencies-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-07-resource-dependencies-root .toc small { display:block;color:#62666e }
      #d-07-resource-dependencies-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-07-resource-dependencies-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-07-resource-dependencies-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-07-resource-dependencies-root .sources { font-size:13px;color:#62666e }
      #d-07-resource-dependencies-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-07-resource-dependencies-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-07-resource-dependencies-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-07-resource-dependencies-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-07-resource-dependencies-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-07-resource-dependencies-root td, #d-07-resource-dependencies-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-07-resource-dependencies-root td code { font-size:12px }
      #d-07-resource-dependencies-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-07-resource-dependencies-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-07-resource-dependencies-root .table-scroll table { min-width:1040px }
      #d-07-resource-dependencies-root ul { padding-left:20px }
      #d-07-resource-dependencies-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-07-resource-dependencies-root .toc, #d-07-resource-dependencies-root .split { grid-template-columns:1fr }
      #d-07-resource-dependencies-root .lead { font-size:18px }
}
      @media print {
#d-07-resource-dependencies-root .diagram-container { overflow-x:visible;border:0 }
      #d-07-resource-dependencies-root .section { break-before:page }
      #d-07-resource-dependencies-root .toc { display:none }
      #d-07-resource-dependencies-root a { color:inherit }
}</style><marker id="d-07-resource-dependencies-07-resource-dependencies-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-07-resource-dependencies-07-resource-dependencies-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-07-resource-dependencies-07-resource-dependencies-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="48" y="48" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">DEPENDENCIES ARE SATISFIED BY OBSERVATIONS, NOT FIXED SLEEPS</text><path d="M 328 184 L 488 184" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-07-resource-dependencies-07-resource-dependencies-arrow)"/><rect x="368.5" y="150" width="79" height="20" fill="#fff"/><text x="408" y="164" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">STACK REF</text><path d="M 792 184 L 920 184" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-07-resource-dependencies-07-resource-dependencies-arrow)"/><rect x="813.0" y="150" width="86" height="20" fill="#fff"/><text x="856" y="164" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">ACCOUNT ID</text><path d="M 328 468 L 488 468" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-07-resource-dependencies-07-resource-dependencies-arrow)"/><rect x="368.5" y="434" width="79" height="20" fill="#fff"/><text x="408" y="448" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">POLICY ID</text><path d="M 792 468 L 920 468" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-07-resource-dependencies-07-resource-dependencies-arrow)"/><rect x="823.5" y="434" width="65" height="20" fill="#fff"/><text x="856" y="448" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">PUBLISH</text><path d="M 184 276 V 320 Q 184 328 192 328 H 1072 Q 1080 328 1080 336 V 376" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-07-resource-dependencies-07-resource-dependencies-arrow)"/><rect x="593.5" y="298" width="93" height="20" fill="#fff"/><text x="640" y="312" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">STACK READY</text><g><rect x="48" y="96" width="280" height="180" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="68" y="124" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">FOUNDATION</text><text x="68" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Stack</text><text x="68" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Cloud identity and endpoints</text><text x="68" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Organization-plane provider</text><text x="68" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Observed ID and readiness</text></g><g><rect x="488" y="96" width="304" height="180" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="508" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">ORG PLANE</text><text x="508" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">StackServiceAccount</text><text x="508" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Admin bootstrap account</text><text x="508" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Observed account ID</text></g><g><rect x="920" y="96" width="312" height="180" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="940" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">STACK SERVICE ACCOUNT</text><text x="940" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Rotating admin token</text><text x="940" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Connection Secret produced</text><text x="940" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">ESO handoff: next diagram</text></g><g><rect x="48" y="376" width="280" height="184" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="68" y="404" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">ORG PLANE</text><text x="68" y="436" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Access policies</text><text x="68" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Telemetry publisher (default)</text><text x="68" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Fleet policy (core)</text><text x="68" y="512" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Separate scopes and tokens</text></g><g><rect x="488" y="376" width="304" height="184" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="508" y="404" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">ACCESS POLICY</text><text x="508" y="436" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Rotating policy tokens</text><text x="508" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Wait for observed policy IDs</text><text x="508" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Dedicated connection Secrets</text></g><g><rect x="920" y="376" width="312" height="184" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="940" y="404" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">EXPLICIT OPT-IN</text><text x="940" y="436" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Stack-local modules</text><text x="940" y="464" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Wait for Stack + ESO readiness</text><text x="940" y="488" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Use per-stack ProviderConfig</text><text x="940" y="512" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Access / content / operations</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Arrows name prerequisite observations or publication dependencies; ESO and baseline content are collapsed.</text></svg>
