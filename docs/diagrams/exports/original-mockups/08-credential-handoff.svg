<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="08-credential-handoff-title 08-credential-handoff-desc" id="d-08-credential-handoff-root"><title id="08-credential-handoff-title">Secure handoff is part of the product</title><desc id="08-credential-handoff-desc">ESO publishes generated bootstrap credentials to an external store and reads back the stack-local provider credential. Consumer telemetry credentials use a separate policy and publication path.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-08-credential-handoff-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-08-credential-handoff-root a { color:#2459a6;text-underline-offset:3px }
      #d-08-credential-handoff-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-08-credential-handoff-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-08-credential-handoff-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-08-credential-handoff-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-08-credential-handoff-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-08-credential-handoff-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-08-credential-handoff-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-08-credential-handoff-root .toc small { display:block;color:#62666e }
      #d-08-credential-handoff-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-08-credential-handoff-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-08-credential-handoff-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-08-credential-handoff-root .sources { font-size:13px;color:#62666e }
      #d-08-credential-handoff-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-08-credential-handoff-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-08-credential-handoff-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-08-credential-handoff-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-08-credential-handoff-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-08-credential-handoff-root td, #d-08-credential-handoff-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-08-credential-handoff-root td code { font-size:12px }
      #d-08-credential-handoff-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-08-credential-handoff-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-08-credential-handoff-root .table-scroll table { min-width:1040px }
      #d-08-credential-handoff-root ul { padding-left:20px }
      #d-08-credential-handoff-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-08-credential-handoff-root .toc, #d-08-credential-handoff-root .split { grid-template-columns:1fr }
      #d-08-credential-handoff-root .lead { font-size:18px }
}
      @media print {
#d-08-credential-handoff-root .diagram-container { overflow-x:visible;border:0 }
      #d-08-credential-handoff-root .section { break-before:page }
      #d-08-credential-handoff-root .toc { display:none }
      #d-08-credential-handoff-root a { color:inherit }
}</style><marker id="d-08-credential-handoff-08-credential-handoff-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-08-credential-handoff-08-credential-handoff-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-08-credential-handoff-08-credential-handoff-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="48" y="48" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">ADMIN BOOTSTRAP CHAIN / SECRET MATERIAL STAYS OUT OF GIT</text><path d="M 344 200 L 488 200" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-08-credential-handoff-08-credential-handoff-arrow)"/><rect x="373.0" y="166" width="86" height="20" fill="#fff"/><text x="416" y="180" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">CONNECTION</text><path d="M 784 200 L 928 200" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-08-credential-handoff-08-credential-handoff-arrow)"/><rect x="827.0" y="166" width="58" height="20" fill="#fff"/><text x="856" y="180" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">EXPORT</text><path d="M 1072 280 L 1072 388" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-08-credential-handoff-08-credential-handoff-arrow)"/><rect x="1096.5" y="326" width="79" height="20" fill="#fff"/><text x="1136" y="340" text-anchor="middle" fill="#62666e" font-family="Geist Mono, monospace" font-size="11">READ BACK</text><path d="M 928 468 L 784 468" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-08-credential-handoff-08-credential-handoff-arrow)"/><rect x="820.0" y="434" width="72" hei