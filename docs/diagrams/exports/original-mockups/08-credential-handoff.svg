><text x="948" y="180" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">External secret manager</text><text x="948" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Adopter-selected backend</text><text x="948" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Access policy and audit</text></g><g><rect x="928" y="388" width="304" height="160" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="948" y="416" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">MATERIALIZE</text><text x="948" y="448" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">ESO ExternalSecret</text><text x="948" y="476" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Reads exported document</text><text x="948" y="500" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Builds scoped credentials</text></g><g><rect x="488" y="388" width="296" height="160" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="508" y="416" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">LOCAL</text><text x="508" y="448" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Kubernetes Secret</text><text x="508" y="476" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Stack URL + authorization</text><text x="508" y="500" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Namespace-scoped access</text></g><g><rect x="48" y="388" width="296" height="160" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="68" y="416" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">REFERENCE</text><text x="68" y="448" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Stack ProviderConfig</text><text x="68" y="476" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Namespaced per-stack config</text><text x="68" y="500" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Used by stack-local resources</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Arrows show credential publication / references. No actual credential values or live endpoints are included.</text></svg>
