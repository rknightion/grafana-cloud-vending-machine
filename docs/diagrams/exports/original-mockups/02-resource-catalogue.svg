<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="02-resource-catalogue-title 02-resource-catalogue-desc" id="d-02-resource-catalogue-root"><title id="02-resource-catalogue-title">What can the machine vend?</title><desc id="02-resource-catalogue-desc">A stack is the starting point. The useful service includes access, content, collection and operations, selected according to workload needs and platform policy.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-02-resource-catalogue-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-02-resource-catalogue-root a { color:#2459a6;text-underline-offset:3px }
      #d-02-resource-catalogue-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-02-resource-catalogue-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-02-resource-catalogue-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-02-resource-catalogue-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-02-resource-catalogue-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-02-resource-catalogue-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-02-resource-catalogue-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-02-resource-catalogue-root .toc small { display:block;color:#62666e }
      #d-02-resource-catalogue-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-02-resource-catalogue-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-02-resource-catalogue-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-02-resource-catalogue-root .sources { font-size:13px;color:#62666e }
      #d-02-resource-catalogue-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-02-resource-catalogue-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-02-resource-catalogue-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-02-resource-catalogue-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-02-resource-catalogue-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-02-resource-catalogue-root td, #d-02-resource-catalogue-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-02-resource-catalogue-root td code { font-size:12px }
      #d-02-resource-catalogue-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-02-resource-catalogue-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-02-resource-catalogue-root .table-scroll table { min-width:1040px }
      #d-02-resource-catalogue-root ul { padding-left:20px }
      #d-02-resource-catalogue-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-02-resource-catalogue-root .toc, #d-02-resource-catalogue-root .split { grid-template-columns:1fr }
      #d-02-resource-catalogue-root .lead { font-size:18px }
}
      @media print {
#d-02-resource-catalogue-root .diagram-container { overflow-x:visible;border:0 }
      #d-02-resource-catalogue-root .section { break-before:page }
      #d-02-resource-catalogue-root .toc { display:none }
      #d-02-resource-catalogue-root a { color:inherit }
}</style><marker id="d-02-resource-catalogue-02-resource-catalogue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-02-resource-catalogue-02-resource-catalogue-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-02-resource-catalogue-02-resource-catalogue-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="48" y="48" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">STACK FOUNDATION + EXPLICIT CAPABILITY SELECTION</text><g><rect x="48" y="96" width="280" height="224" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="68" y="124" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">CORE</text><text x="68" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Stack foundation</text><text x="68" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Identity, region, endpoints</text><text x="68" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Admin account + rotation</text><text x="68" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Telemetry policy + token</text></g><g><rect x="352" y="96" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="372" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">SELECTED</text><text x="372" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Identity and teams</text><text x="372" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">OAuth / OIDC or SAML settings</text><text x="372" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">External-group Team Sync</text><text x="372" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Members and preferences</text></g><g><rect x="656" y="96" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="676" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">OPT-IN</text><text x="676" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Access controls</text><text x="676" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Custom roles and assignments</text><text x="676" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Folder / dashboard ACLs</text><text x="676" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Data source ACLs + LBAC</text></g><g><rect x="960" y="96" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="980" y="124" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">CORE + OPT-IN</text><text x="980" y="156" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Dashboards and content</text><text x="980" y="184" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Baseline folders + dashboards</text><text x="980" y="208" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Project content and home view</text><text x="980" y="232" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Git provisioning (preview)</text></g><g><rect x="48" y="360" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="68" y="388" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">OPT-IN</text><text x="68" y="420" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Alerting and response</text><text x="68" y="448" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Rule groups, contact points</text><text x="68" y="472" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Templates, mutes, routing</text><text x="68" y="496" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Schedules and escalation</text></g><g><rect x="352" y="360" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="372" y="388" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">CORE + OPT-IN</text><text x="372" y="420" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Collection and links</text><text x="372" y="448" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Fleet pipelines + tokens</text><text x="372" y="472" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Cloud integrations / jobs</text><text x="372" y="496" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">PDC networks and tokens</text></g><g><rect x="656" y="360" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="676" y="388" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">OPT-IN</text><text x="676" y="420" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Reliability and UX</text><text x="676" y="448" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Golden SLO, Synthetic checks</text><text x="676" y="472" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">k6 projects and tests</text><text x="676" y="496" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Frontend and product settings</text></g><g><rect x="960" y="360" width="280" height="224" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="980" y="388" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">OPT-IN</text><text x="980" y="420" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Advanced and inventory</text><text x="980" y="448" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">ML jobs, holidays, outliers</text><text x="980" y="472" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Asserts / Assistant / AI</text><text x="980" y="496" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Observe-only stack inventory</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Groups show capability coverage; they do not represent eight automatic API calls.</text></svg>
