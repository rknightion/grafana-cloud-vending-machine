<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="04-telecom-fleet-2-title 04-telecom-fleet-2-desc" id="d-04-telecom-fleet-2-root"><title id="04-telecom-fleet-2-title">Sixteen markets, sixteen stacks: 9–16</title><desc id="04-telecom-fleet-2-desc">Fleet panel 2 of 2. Every market gets a separate stack; shared definitions are copied or reconciled into each stack, while market profiles determine the differences.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-telecom-fleet-2-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-04-telecom-fleet-2-root a { color:#2459a6;text-underline-offset:3px }
      #d-04-telecom-fleet-2-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-04-telecom-fleet-2-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-04-telecom-fleet-2-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-04-telecom-fleet-2-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-04-telecom-fleet-2-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-04-telecom-fleet-2-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-04-telecom-fleet-2-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-04-telecom-fleet-2-root .toc small { display:block;color:#62666e }
      #d-04-telecom-fleet-2-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-04-telecom-fleet-2-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-04-telecom-fleet-2-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-04-telecom-fleet-2-root .sources { font-size:13px;color:#62666e }
      #d-04-telecom-fleet-2-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-04-telecom-fleet-2-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-04-telecom-fleet-2-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-04-telecom-fleet-2-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-04-telecom-fleet-2-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-04-telecom-fleet-2-root td, #d-04-telecom-fleet-2-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-04-telecom-fleet-2-root td code { font-size:12px }
      #d-04-telecom-fleet-2-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-04-telecom-fleet-2-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-04-telecom-fleet-2-root .table-scroll table { min-width:1040px }
      #d-04-telecom-fleet-2-root ul { padding-left:20px }
      #d-04-telecom-fleet-2-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-04-telecom-fleet-2-root .toc, #d-04-telecom-fleet-2-root .split { grid-template-columns:1fr }
      #d-04-telecom-fleet-2-root .lead { font-size:18px }
}
      @media print {
#d-04-telecom-fleet-2-root .diagram-container { overflow-x:visible;border:0 }
      #d-04-telecom-fleet-2-root .section { break-before:page }
      #d-04-telecom-fleet-2-root .toc { display:none }
      #d-04-telecom-fleet-2-root a { color:inherit }
