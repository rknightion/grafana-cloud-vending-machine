<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="06-crossplane-ownership-title 06-crossplane-ownership-desc" id="d-06-crossplane-ownership-root"><title id="06-crossplane-ownership-title">Three ownership roles, one desired state</title><desc id="06-crossplane-ownership-desc">Argo CD syncs platform definitions and request objects. Crossplane composes the child resources. The Grafana provider reconciles those children against Grafana Cloud.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-06-crossplane-ownership-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-06-crossplane-ownership-root a { color:#2459a6;text-underline-offset:3px }
      #d-06-crossplane-ownership-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-06-crossplane-ownership-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-06-crossplane-ownership-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-06-crossplane-ownership-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-06-crossplane-ownership-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-06-crossplane-ownership-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-06-crossplane-ownership-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-06-crossplane-ownership-root .toc small { display:block;color:#62666e }
      #d-06-crossplane-ownership-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-06-crossplane-ownership-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-06-crossplane-ownership-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-06-crossplane-ownership-root .sources { font-size:13px;color:#62666e }
      #d-06-crossplane-ownership-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-06-crossplane-ownership-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-06-crossplane-ownership-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-06-crossplane-ownership-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-06-crossplane-ownership-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-06-crossplane-ownership-root td, #d-06-crossplane-ownership-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-06-crossplane-ownership-root td code { font-size:12px }
      #d-06-crossplane-ownership-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-06-crossplane-ownership-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-06-crossplane-ownership-root .table-scroll table { min-width:1040px }
      #d-06-crossplane-ownership-root ul { padding-left:20px }
      #d-06-crossplane-ownership-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-06-crossplane-ownership-root .toc, #d-06-crossplane-ownership-root .split { grid-template-columns:1fr }
      #d-06-crossplane-ownership-root .lead { font-size:18px }
}
      @media print {
#d-06-crossplane-ownership-root .diagram-container { overflow-x:visible;border:0 }
      #d-06-crossplane-ownership-root .section { break-before:page }
      #d-06-crossplane-ownership-root .toc { display:none }
      #d-06-crossplane-ownership-root a { color:inherit }
}</style><marker id="d-06-crossplane-ownership-06-crossplane-ownership-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-06-crossplane-ownership-06-crossplane-ownership-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-06-crossplane-ownership-06-crossplane-ownership-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><rect x="40" y="40" width="1200" height="276" rx="8" fill="#f7f8f9" stroke="#dedfe2"/><text x="60" y="68" fill="#62666e" font-family="Geist Mono, monospace" font-size="12" font-weight="500">DESIRED STATE / KUBERNETES CONTROL PLANE</text><rect x="40" y="356" width="1200" height="268" rx="8" fill="#f7f8f9" stroke="#dedfe2"/><text x="60" y="384" fill="#62666e" font-family="Geist Mono, monospace" font-size="12" font-weight="500">RECONCILIATION / EXTERNAL SERVICE</text><path d="M 304 176 L 376 176" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-06-crossplane-ownership-06-crossplane-ownership-arrow)"/><path d="M 640 176 L 712 176" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-06-crossplane-ownership-06-crossplane-ownership-arrow)"/><path d="M 976 176 L 1048 176" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-06-crossplane-ownership-06-crossplane-ownership-arrow)"/><path d="M 1128 248 V 344 Q 1128 352 1120 352 H 224 Q 216 352 216 360 V 416" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-06-crossplane-ownership-06-crossplane-ownership-arrow)"/><path d="M 392 488 L 464 488" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-06-crossplane-ownership-06-crossplane-ownership-arrow)"/><path d="M 744 488 L 816 488" fill="none" stroke="#2459a6" str