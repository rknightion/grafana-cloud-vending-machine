<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="03-service-journey-title 03-service-journey-desc" id="d-03-service-journey-root"><title id="03-service-journey-title">Provisioning is one stage of the service</title><desc id="03-service-journey-desc">Keep the intake, policy, provisioning, operations and retirement responsibilities explicit, whichever IaC tool runs the recipe.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-service-journey-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-03-service-journey-root a { color:#2459a6;text-underline-offset:3px }
      #d-03-service-journey-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-03-service-journey-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-03-service-journey-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-03-service-journey-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-03-service-journey-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-03-service-journey-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-03-service-journey-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-03-service-journey-root .toc small { display:block;color:#62666e }
      #d-03-service-journey-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-03-service-journey-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-03-service-journey-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-03-service-journey-root .sources { font-size:13px;color:#62666e }
      #d-03-service-journey-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-03-service-journey-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-03-service-journey-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-03-service-journey-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-03-service-journey-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-03-service-journey-root td, #d-03-service-journey-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-03-service-journey-root td code { font-size:12px }
      #d-03-service-journey-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-03-service-journey-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-03-service-journey-root .table-scroll table { min-width:1040px }
      #d-03-service-journey-root ul { padding-left:20px }
      #d-03-service-journey-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-03-service-journey-root .toc, #d-03-service-journey-root .split { grid-template-columns:1fr }
      #d-03-service-journey-root .lead { font-size:18px }
}
      @media print {
#d-03-service-journey-root .diagram-container { overflow-x:visible;border:0 }
      #d-03-service-journey-root .section { break-before:page }
      #d-03-service-journey-root .toc { display:none }
      #d-03-service-journey-root a { color:inherit }
}</style><marker id="d-03-service-journey-03-service-journey-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-03-service-journey-03-service-journey-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-03-service-journey-03-service-journey-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="48" y="48" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">THE SAME CONTRACT FROM REQUEST TO RETIREMENT</text><path d="M 264 196 L 288 196" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-03-service-journey-03-service-journey-arrow)"/><path d="M 504 196 L 528 196" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-03-service-journey-03-service-journey-arrow)"/><path d="M 744 196 L 768 196" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-03-service-journey-03-service-journey-arrow)"/><path d="M 984 196 L 1008 196" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-03-service-journey-03-service-journey-arrow)"/><g><rect x="48" y="112" width="216" height="144" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="68" y="140" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">LIFECYCLE</text><text x="68" y="172" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Request</text><text x="68" y="200" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">01 / service stage</text></g><text x="60" y="304" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">OWNER</text><text x="60" y="332" fill="#202226" font-family=