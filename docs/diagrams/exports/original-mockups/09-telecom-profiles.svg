<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="09-telecom-profiles-title 09-telecom-profiles-desc" id="d-09-telecom-profiles-root"><title id="09-telecom-profiles-title">A shared baseline does not mean identical stacks</title><desc id="09-telecom-profiles-desc">Each market selects approved local configuration while inheriting a versioned common service baseline. The same pattern is repeated for all sixteen stacks.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-09-telecom-profiles-root { color: #202226; font-family: Geist,Arial,sans-serif; }
      #d-09-telecom-profiles-root a { color:#2459a6;text-underline-offset:3px }
      #d-09-telecom-profiles-root a:focus-visible { outline:3px solid #bd3e12;outline-offset:5px }
      #d-09-telecom-profiles-root .lead { font-size:20px;color:#50545b;max-width:920px }
      #d-09-telecom-profiles-root .status { display:inline-block;border:1px solid #bd3e12;padding:5px 10px;color:#a63712;font-size:12px;font-weight:600 }
      #d-09-telecom-profiles-root .intro { border-bottom:1px solid #dedfe2;padding-bottom:32px }
      #d-09-telecom-profiles-root .toc { display:grid;grid-template-columns:1.1fr 1fr;gap:0 32px;margin:28px 0 56px }
      #d-09-telecom-profiles-root .toc a { display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #dedfe2;text-decoration:none;color:#202226 }
      #d-09-telecom-profiles-root .toc b { color:#a63712;font-family:"Geist Mono",monospace;font-weight:400 }
      #d-09-telecom-profiles-root .toc small { display:block;color:#62666e }
      #d-09-telecom-profiles-root .section { padding:48px 0 32px;border-top:1px solid #dedfe2;scroll-margin-top:12px }
      #d-09-telecom-profiles-root .diagram-container { width:100%;overflow-x:auto;border:1px solid #dedfe2;border-radius:8px;margin:24px 0 16px }
      #d-09-telecom-profiles-root .note { padding:16px 20px;border-left:3px solid #bd3e12;background:#fff5ef;color:#4d372b;max-width:none }
      #d-09-telecom-profiles-root .sources { font-size:13px;color:#62666e }
      #d-09-telecom-profiles-root .meta { font:12px "Geist Mono",monospace;color:#62666e }
      #d-09-telecom-profiles-root .split { display:grid;grid-template-columns:1.15fr 1fr;gap:28px }
      #d-09-telecom-profiles-root .panel { border:1px solid #dedfe2;border-radius:6px;padding:24px }
      #d-09-telecom-profiles-root table { border-collapse:collapse;width:100%;font-size:14px }
      #d-09-telecom-profiles-root th { text-align:left;font-size:12px;letter-spacing:.03em;color:#595d65;background:#f5f6f7 }
      #d-09-telecom-profiles-root td, #d-09-telecom-profiles-root th { padding:14px 16px;border:1px solid #dedfe2;vertical-align:top }
      #d-09-telecom-profiles-root td code { font-size:12px }
      #d-09-telecom-profiles-root code { font-family:"Geist Mono",monospace;background:#f5f6f7;padding:2px 4px;border-radius:2px }
      #d-09-telecom-profiles-root .table-scroll { overflow-x:auto;margin:24px 0 }
      #d-09-telecom-profiles-root .table-scroll table { min-width:1040px }
      #d-09-telecom-profiles-root ul { padding-left:20px }
      #d-09-telecom-profiles-root li { margin:7px 0 }
      @media(max-width:720px) {
#d-09-telecom-profiles-root .toc, #d-09-telecom-profiles-root .split { grid-template-columns:1fr }
      #d-09-telecom-profiles-root .lead { font-size:18px }
}
      @media print {
#d-09-telecom-profiles-root .diagram-container { overflow-x:visible;border:0 }
      #d-09-telecom-profiles-root .section { break-before:page }
      #d-09-telecom-profiles-root .toc { display:none }
      #d-09-telecom-profiles-root a { color:inherit }
}</style><marker id="d-09-telecom-profiles-09-telecom-profiles-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#62666e"/></marker><marker id="d-09-telecom-profiles-09-telecom-profiles-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2459a6"/></marker><marker id="d-09-telecom-profiles-09-telecom-profiles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd3e12"/></marker></defs><rect width="1280" height="720" fill="#fff"/><text x="48" y="48" fill="#62666e" font-family="Geist Mono, monospace" font-size="14" font-weight="500">SAME BASELINE VERSION / THREE EXAMPLE MARKET INSTANTIATIONS</text><g><rect x="48" y="88" width="1184" height="112" rx="6" fill="#fff5ef" stroke="#bd3e12" stroke-width="2"/><text x="68" y="116" fill="#bd3e12" font-family="Geist Mono, monospace" font-size="11" font-weight="500">SHARED RECIPE</text><text x="68" y="148" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Fleet baseline</text><text x="68" y="176" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">NOC starter pack · naming and labels · minimum access policy · credential rotation · Retain default</text></g><path d="M 224 200 L 224 272" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><path d="M 640 200 L 640 272" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><path d="M 1056 200 L 1056 272" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><g><rect x="48" y="272" width="352" height="248" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="68" y="300" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">MARKET VARIATION</text><text x="68" y="332" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">UK market profile</text><text x="68" y="360" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Entra ID / UK application</text><text x="68" y="384" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Teams: NOC, RAN, Core</text><text x="68" y="408" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Content: RAN + Core views</text><text x="68" y="432" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">RBAC: UK folder scopes</text><text x="68" y="456" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">LBAC: UK + domain labels</text></g><path d="M 224 520 L 224 560" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><g><rect x="48" y="560" width="352" height="64" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="68" y="596" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">UK stack</text></g><g><rect x="464" y="272" width="352" height="248" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="484" y="300" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">MARKET VARIATION</text><text x="484" y="332" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">Germany market profile</text><text x="484" y="360" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">SAML / DE metadata + claims</text><text x="484" y="384" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Teams: NOC, Core, SOC</text><text x="484" y="408" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Content: Core + Security views</text><text x="484" y="432" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">RBAC: DE operations scopes</text><text x="484" y="456" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">LBAC: DE + domain labels</text></g><path d="M 640 520 L 640 560" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><g><rect x="464" y="560" width="352" height="64" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="484" y="596" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">DE stack</text></g><g><rect x="880" y="272" width="352" height="248" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="900" y="300" fill="#62666e" font-family="Geist Mono, monospace" font-size="11" font-weight="500">MARKET VARIATION</text><text x="900" y="332" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">France market profile</text><text x="900" y="360" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Okta / FR app + allowed groups</text><text x="900" y="384" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Teams: NOC, Fixed, Digital</text><text x="900" y="408" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">Content: Fixed + Digital views</text><text x="900" y="432" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">RBAC: FR service scopes</text><text x="900" y="456" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="15" font-weight="400">LBAC: FR + domain labels</text></g><path d="M 1056 520 L 1056 560" fill="none" stroke="#62666e" stroke-width="1.5"  marker-end="url(#d-09-telecom-profiles-09-telecom-profiles-arrow)"/><g><rect x="880" y="560" width="352" height="64" rx="6" fill="#fff" stroke="#8b9098" stroke-width="1"/><text x="900" y="596" fill="#202226" font-family="Geist, Arial, sans-serif" font-size="20" font-weight="600">FR stack</text></g><path d="M 40 652 H 1240" stroke="#dedfe2"/><text x="40" y="684" fill="#62666e" font-family="Geist, Arial, sans-serif" font-size="13" font-weight="400">Arrows mean baseline plus market-specific configuration is instantiated into each stack. No runtime data sharing.</text></svg>
