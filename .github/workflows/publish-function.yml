name: Publish Grafana vending function

on:
  pull_request:
    paths:
      - platform/function/**
      - .github/workflows/publish-function.yml
  push:
    branches:
      - main
    paths:
      - platform/function/**
      - .github/workflows/publish-function.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25.11
  CROSSPLANE_VERSION: v2.3.4
  CROSSPLANE_LINUX_AMD64_SHA256: 6423a01981a701315cbf978a6dbcd45575f6b881bc80f4c25f9c09dd403bc1c5
  XPKG: ghcr.io/rknightion/grafana-cloud-vending-machine/function-grafana-vending

jobs:
  test:
    name: Test function
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform/function
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: platform/function/go.sum

      - name: Check module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race -cover ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.arch }} package
    needs: test
    runs-on: ubuntu-24.04
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: platform/function
          platforms: linux/${{ matrix.arch }}
          target: image
          cache-from: type=gha,scope=grafana-vending-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grafana-vending-${{ matrix.arch }}
          outputs: type=docker,dest=${{ github.workspace }}/runtime-${{ matrix.arch }}.tar

      - name: Install pinned Crossplane CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crank" \
            --output crossplane
          echo "${CROSSPLANE_LINUX_AMD64_SHA256}  crossplane" | sha256sum --check
          chmod +x crossplane

      - name: Build single-platform package
        run: |
          ./crossplane xpkg build \
            --package-file="function-grafana-vending-${PACKAGE_ARCH}.xpkg" \
            --package-root=platform/function/package \
            --embed-runtime-image-tarball="runtime-${PACKAGE_ARCH}.tar"

      - name: Upload single-platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grafana-vending-${{ matrix.arch }}
          path: function-grafana-vending-${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and sign package
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Keyless Cosign signing through GitHub OIDC.
      packages: write # Publish the Crossplane package to GHCR.
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: grafana-vending-*
          path: .
          merge-multiple: true

      - name: Install pinned Crossplane CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crank" \
            --output crossplane
          echo "${CROSSPLANE_LINUX_AMD64_SHA256}  crossplane" | sha256sum --check
          chmod +x crossplane

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable package version
        shell: bash
        run: echo "XPKG_VERSION=v0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Push multi-platform package
        shell: bash
        run: |
          ./crossplane xpkg push \
            --package-files="function-grafana-vending-amd64.xpkg,function-grafana-vending-arm64.xpkg" \
            "${XPKG}:${XPKG_VERSION}"
          ./crossplane xpkg push \
            --package-files="function-grafana-vending-amd64.xpkg,function-grafana-vending-arm64.xpkg" \
            "${XPKG}:main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable package digest
        shell: bash
        run: |
          digest=$(docker buildx imagetools inspect "${XPKG}:${XPKG_VERSION}" --format '{{json .Manifest}}' | jq --raw-output .digest)
          test "${digest#sha256:}" != "$digest"
          cosign sign --yes "${XPKG}@${digest}"
          {
            echo "### Grafana vending function"
            echo
            echo "\`${XPKG}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
