name: Publish Grafana vending function

on:
  pull_request:
    paths:
      - platform/function/*.go
      - platform/function/go.mod
      - platform/function/go.sum
      - platform/function/Dockerfile
      - platform/function/.dockerignore
      - platform/function/package/**
      - .github/workflows/publish-function.yml
  push:
    branches:
      - main
    paths:
      - platform/function/*.go
      - platform/function/go.mod
      - platform/function/go.sum
      - platform/function/Dockerfile
      - platform/function/.dockerignore
      - platform/function/package/**
      - .github/workflows/publish-function.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: grafana-vending-function-publication
  cancel-in-progress: false

env:
  CROSSPLANE_VERSION: v2.3.4
  CROSSPLANE_LINUX_AMD64_SHA256: 6423a01981a701315cbf978a6dbcd45575f6b881bc80f4c25f9c09dd403bc1c5
  CROSSPLANE_LINUX_ARM64_SHA256: 0f337337642b5ef91924db0f43496bbf2cc7653855820a813af1d68c2d34d37e
  XPKG: ghcr.io/rknightion/grafana-cloud-vending-machine/function-grafana-vending

jobs:
  test:
    name: Test function
    runs-on: ubuntu-26.04
    outputs:
      runtime-changed: ${{ steps.runtime-changes.outputs.changed }}
    defaults:
      run:
        working-directory: platform/function
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Admission helpers and tests do not change the function's runtime behavior.
      # Preserve dependency-version and runtime-source changes as publish inputs.
      - name: Determine whether runtime inputs changed
        id: runtime-changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          def module_lines(ref):
              return sorted(line.replace("// indirect", "").strip()
                            for line in git("show", ref + ":platform/function/go.mod").splitlines()
                            if line.strip() not in ("", "require (", ")"))

          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          changed = os.environ["EVENT_NAME"] == "workflow_dispatch" or not base or set(base) == {"0"}
          if not changed:
              for path in git("diff", "--name-only", base, head, "--", "platform/function").splitlines():
                  if path.endswith("_test.go"):
                      continue
                  if path == "platform/function/go.mod" and module_lines(base) == module_lines(head):
                      continue
                  if path.endswith(".go") or path in (
                      "platform/function/go.mod", "platform/function/go.sum",
                      "platform/function/Dockerfile", "platform/function/.dockerignore",
                  ) or path.startswith("platform/function/package/"):
                      changed = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=" + str(changed).lower() + "\n")
          print("Runtime inputs changed: " + str(changed).lower())
          PY

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: platform/function/go.mod
          cache-dependency-path: platform/function/go.sum
          # See validate.yml: same go-version-file and the same write guard,
          # so both workflows resolve to one cache key instead of two.
          cache: ${{ github.event_name != 'pull_request' }}

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Provision pinned envtest assets
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          envtest_version="$(just --evaluate ENVTEST_KUBERNETES_VERSION)"
          test -n "$envtest_version"
          release_url="https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v${envtest_version}"
          archive_name="envtest-v${envtest_version}-linux-amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          checksum_path="${archive_path}.sha512"
          extract_path="${RUNNER_TEMP}/envtest-v${envtest_version}-linux-amd64"
          assets_path="${extract_path}/controller-tools/envtest"

          curl --fail --location --retry 3 --retry-all-errors --output "$archive_path" "${release_url}/${archive_name}"
          curl --fail --location --retry 3 --retry-all-errors --output "$checksum_path" "${release_url}/${archive_name}.sha512"

          expected_sha512="$(awk -v asset="/${archive_name}" '
            NR == 1 && $1 ~ /^[[:xdigit:]]+$/ && length($1) == 128 && $2 == asset && NF == 2 { print $1; next }
            { exit 1 }
            END { if (NR != 1) exit 1 }
          ' "$checksum_path")" || { echo "Published checksum sidecar has an unexpected format" >&2; exit 1; }
          printf '%s  %s\n' "$expected_sha512" "$archive_name" | (cd "$RUNNER_TEMP" && sha512sum --check -)
          echo "Verified ${archive_name} against ${release_url}/${archive_name}.sha512"

          mkdir -p "$extract_path"
          tar --extract --gzip --file "$archive_path" --directory "$extract_path"
          test -x "$assets_path/kube-apiserver"
          test -x "$assets_path/etcd"

          expected_kubernetes_version="Kubernetes v${envtest_version}"
          kube_apiserver_version="$("$assets_path/kube-apiserver" --version)"
          test "$kube_apiserver_version" = "$expected_kubernetes_version" || { echo "Expected kube-apiserver $expected_kubernetes_version, found $kube_apiserver_version" >&2; exit 1; }
          echo "KUBEBUILDER_ASSETS=$assets_path"
          echo "kube-apiserver: $kube_apiserver_version"
          echo "etcd: $("$assets_path/etcd" --version)"
          printf 'ENVTEST_KUBERNETES_VERSION=%s\n' "$envtest_version" >> "$GITHUB_ENV"
          printf 'KUBEBUILDER_ASSETS=%s\n' "$assets_path" >> "$GITHUB_ENV"

      - name: Check module files
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test -race -cover ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.arch }} package
    needs: test
    if: needs.test.outputs.runtime-changed == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # Read/write the GHCR registry cache below.
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Needed to pull (and, on a default-branch push, push) the registry
      # cache below. A pull_request run from a fork gets a read-only
      # GITHUB_TOKEN, so its cache-to write is skipped rather than failing.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/function
          platforms: linux/${{ matrix.arch }}
          target: image
          # A GHCR registry cache instead of type=gha: the previous gha-scoped
          # cache lived alongside the setup-go caches against the same 10GB
          # per-repository Actions cache cap, and a registry cache does not.
          # Cache writes are default-branch-only so a fork PR's read-only
          # token, which cannot push here, never needs to.
          cache-from: type=registry,ref=${{ env.XPKG }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache-{1},mode=max', env.XPKG, matrix.arch) || '' }}
          outputs: type=docker,dest=${{ github.workspace }}/runtime-${{ matrix.arch }}.tar

      - name: Install verified Trivy release
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          version=0.70.0
          case "$RUNNER_ARCH" in
            X64) arch=Linux-64bit ;;
            ARM64) arch=Linux-ARM64 ;;
            *) echo "Unsupported Trivy runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          scratch=$(mktemp -d "$RUNNER_TEMP/trivy-download.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          asset="trivy_${version}_${arch}.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          for name in "$asset" "trivy_${version}_checksums.txt"; do
            curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
              --connect-timeout 20 --max-time 60 --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --output "$scratch/$name" "$base/$name"
          done
          cd "$scratch"
          awk -v asset="$asset" '$2 == asset {print}' "trivy_${version}_checksums.txt" > selected.sha256
          test "$(wc -l < selected.sha256)" -eq 1
          sha256sum --check --strict selected.sha256
          tar -xzf "$asset" trivy
          install -d "$RUNNER_TEMP/trivy-bin"
          install -m 0755 trivy "$RUNNER_TEMP/trivy-bin/trivy"
          "$RUNNER_TEMP/trivy-bin/trivy" --version
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Gate before anything is published: the runtime image tarball that the
      # package embeds is scanned and a HIGH or CRITICAL finding that has a fix
      # fails the build. Read-only; it changes neither the image nor the package.
      - name: Scan runtime image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          input: ${{ github.workspace }}/runtime-${{ matrix.arch }}.tar
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # The action's cache writes a new dated Actions-cache entry every day.
          cache: false

      - name: Install pinned Crossplane CLI
        shell: bash
        run: |
          set -euo pipefail
          case "${PACKAGE_ARCH}:$(uname -m)" in
            amd64:x86_64) checksum="$CROSSPLANE_LINUX_AMD64_SHA256" ;;
            arm64:aarch64) checksum="$CROSSPLANE_LINUX_ARM64_SHA256" ;;
            *) echo "Runner architecture does not match package architecture ${PACKAGE_ARCH}" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_${PACKAGE_ARCH}/crank" \
            --output crossplane
          printf '%s  crossplane\n' "$checksum" | sha256sum --check
          chmod +x crossplane

      - name: Build single-platform package
        run: |
          ./crossplane xpkg build \
            --package-file="function-grafana-vending-${PACKAGE_ARCH}.xpkg" \
            --package-root=platform/function/package \
            --embed-runtime-image-tarball="runtime-${PACKAGE_ARCH}.tar"

      - name: Upload single-platform package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-vending-${{ matrix.arch }}
          path: function-grafana-vending-${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and sign package
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # Keyless Cosign signing and attestations through GitHub OIDC.
      attestations: write # Build-provenance and SBOM attestations.
      packages: write # Publish the Crossplane package to GHCR.
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grafana-vending-*
          path: .
          merge-multiple: true

      - name: Install pinned Crossplane CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crank" \
            --output crossplane
          echo "${CROSSPLANE_LINUX_AMD64_SHA256}  crossplane" | sha256sum --check
          chmod +x crossplane

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable package version
        shell: bash
        run: echo "XPKG_VERSION=v0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Push multi-platform package
        shell: bash
        run: |
          ./crossplane xpkg push \
            --package-files="function-grafana-vending-amd64.xpkg,function-grafana-vending-arm64.xpkg" \
            "${XPKG}:${XPKG_VERSION}"
          ./crossplane xpkg push \
            --package-files="function-grafana-vending-amd64.xpkg,function-grafana-vending-arm64.xpkg" \
            "${XPKG}:main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4

      - name: Sign immutable package digest
        id: sign
        shell: bash
        run: |
          digest=$(docker buildx imagetools inspect "${XPKG}:${XPKG_VERSION}" --format '{{json .Manifest}}' | jq --raw-output .digest)
          test "${digest#sha256:}" != "$digest"
          cosign sign --yes "${XPKG}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Grafana vending function"
            echo
            echo "\`${XPKG}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.XPKG }}
          subject-digest: ${{ steps.sign.outputs.digest }}
          push-to-registry: true

      # Syft reads one platform from a multi-platform index, so each SBOM is built
      # from and attested to its own platform digest.
      - name: Generate per-platform SBOMs
        id: sbom
        shell: bash
        env:
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect "${XPKG}@${DIGEST}" --raw)
          for arch in amd64 arm64; do
            platform_digest=$(jq --raw-output --arg arch "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
               | if length == 1 then .[0] else error("expected one manifest for \($arch)") end' <<<"$index")
            syft "${XPKG}@${platform_digest}" --output "spdx-json=function-grafana-vending-${arch}.spdx.json"
            echo "${arch}=${platform_digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.XPKG }}
          subject-digest: ${{ steps.sbom.outputs.amd64 }}
          sbom-path: function-grafana-vending-amd64.spdx.json
          push-to-registry: true

      - name: Attest arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.XPKG }}
          subject-digest: ${{ steps.sbom.outputs.arm64 }}
          sbom-path: function-grafana-vending-arm64.spdx.json
          push-to-registry: true

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: function-grafana-vending-sbom
          path: function-grafana-vending-*.spdx.json
          if-no-files-found: error
          retention-days: 30
