name: Validate public reference

on:
  pull_request:
    # `edited` re-runs the workflow when the pull request body changes, so the acceptance evidence
    # check reads the new table. Every job runs on it: a skipped job would report success to ci-success.
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reference
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: platform/function/go.mod
          cache-dependency-path: platform/function/go.sum
          # This workflow's -race test run inflates the setup-go cache to
          # ~690MB. Writing it from every pull_request run, on top of
          # publish-function.yml's own cache, is what pushed the repository
          # past its 10GB Actions cache cap. Only the default branch writes;
          # go-version-file keeps the cache key identical to
          # publish-function.yml's so the two workflows share one entry
          # instead of two.
          cache: ${{ github.event_name != 'pull_request' }}

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Provision pinned envtest assets
        shell: bash
        run: |
          set -euo pipefail
          envtest_version="$(just --evaluate ENVTEST_KUBERNETES_VERSION)"
          test -n "$envtest_version"
          release_url="https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v${envtest_version}"
          archive_name="envtest-v${envtest_version}-linux-amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          checksum_path="${archive_path}.sha512"
          extract_path="${RUNNER_TEMP}/envtest-v${envtest_version}-linux-amd64"
          assets_path="${extract_path}/controller-tools/envtest"

          curl --fail --location --retry 3 --retry-all-errors --output "$archive_path" "${release_url}/${archive_name}"
          curl --fail --location --retry 3 --retry-all-errors --output "$checksum_path" "${release_url}/${archive_name}.sha512"

          expected_sha512="$(awk -v asset="/${archive_name}" '
            NR == 1 && $1 ~ /^[[:xdigit:]]+$/ && length($1) == 128 && $2 == asset && NF == 2 { print $1; next }
            { exit 1 }
            END { if (NR != 1) exit 1 }
          ' "$checksum_path")" || { echo "Published checksum sidecar has an unexpected format" >&2; exit 1; }
          printf '%s  %s\n' "$expected_sha512" "$archive_name" | (cd "$RUNNER_TEMP" && sha512sum --check -)
          echo "Verified ${archive_name} against ${release_url}/${archive_name}.sha512"

          mkdir -p "$extract_path"
          tar --extract --gzip --file "$archive_path" --directory "$extract_path"
          test -x "$assets_path/kube-apiserver"
          test -x "$assets_path/etcd"

          expected_kubernetes_version="Kubernetes v${envtest_version}"
          kube_apiserver_version="$("$assets_path/kube-apiserver" --version)"
          test "$kube_apiserver_version" = "$expected_kubernetes_version" || { echo "Expected kube-apiserver $expected_kubernetes_version, found $kube_apiserver_version" >&2; exit 1; }
          echo "KUBEBUILDER_ASSETS=$assets_path"
          echo "kube-apiserver: $kube_apiserver_version"
          echo "etcd: $("$assets_path/etcd" --version)"
          printf 'KUBEBUILDER_ASSETS=%s\n' "$assets_path" >> "$GITHUB_ENV"

      - name: Validate
        run: just check
        env:
          # The publication scan's identity half takes its pattern set by
          # environment, because that set names specific customers and must
          # never be committed to this public repository. Without it the scan
          # exits 2 rather than passing, so a missing secret fails the gate
          # loudly instead of quietly skipping half the check.
          #
          # A pull request from a fork gets no secrets and so cannot run this
          # half. That is deliberate: such a PR needs a maintainer to re-run the
          # scan locally before merge.
          CUSTOMER_IDENTIFIER_PATTERN: ${{ secrets.CUSTOMER_IDENTIFIER_PATTERN }}
          GCVM_SCAN_ALLOW_MISSING_PATTERNS: ${{ github.event.pull_request.head.repo.fork && '1' || '0' }}

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@e5b9f15bc8ccafdbad75e623bbd0dbb27127f049 # v1.28.0
    with:
      enforce: true

  # Evidence check. The reusable fails on any event but pull_request, so this job is skipped on a push
  # to main. Public repository: only a pull request that closes an issue is checked (the default).
  # Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  # Single aggregator the branch ruleset gates. Keeping the ruleset pinned to one
  # check means the job list above can change without touching branch protection.
  ci-success:
    name: ci-success
    runs-on: ubuntu-26.04
    if: always()
    needs: [validate, zizmor, ac-evidence, privacy-sweep, backlog-freeze]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success, so validate and zizmor must have run and passed on every event,
      # and the pull request checks must have run and passed on a pull request.
      - name: Fail if a required job did not run
        env:
          EVENT: ${{ github.event_name }}
          VALIDATE: ${{ needs.validate.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
        run: |
          if [[ "$VALIDATE" != "success" || "$ZIZMOR" != "success" ]]; then
            echo "validate: ${VALIDATE}, zizmor: ${ZIZMOR}; both must pass"
            exit 1
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" ]]; then
              echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; all must pass on a pull request"
              exit 1
            fi
          elif [[ "$AC_EVIDENCE" != "skipped" || "$PRIVACY_SWEEP" != "skipped" || "$BACKLOG_FREEZE" != "skipped" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; these run on pull requests only"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"
