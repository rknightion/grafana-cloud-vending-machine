configs:
  cm:
    # Crossplane creates child resources that are absent from Git. Annotation
    # tracking prevents Argo CD from claiming them by label inheritance.
    application.resourceTrackingMethod: annotation
    resource.customizations: |
      "*.crossplane.io/*":
        health.lua: |
          local health = {
            status = "Progressing",
            message = "Waiting for Crossplane reconciliation"
          }
          local no_status_kinds = {
            Composition = true,
            CompositionRevision = true,
            DeploymentRuntimeConfig = true,
            ProviderConfig = true,
            ProviderConfigUsage = true
          }
          if obj.status == nil or next(obj.status) == nil then
            if no_status_kinds[obj.kind] then
              health.status = "Healthy"
              health.message = "Resource is configured"
            end
            return health
          end
          if obj.status.conditions == nil then
            if obj.kind == "ProviderConfig" and obj.status.users ~= nil then
              health.status = "Healthy"
              health.message = "Provider configuration is in use"
            end
            return health
          end
          for _, condition in ipairs(obj.status.conditions) do
            if (condition.type == "Synced" or condition.type == "LastAsyncOperation") and condition.status == "False" then
              health.status = "Degraded"
              health.message = condition.message or condition.reason
              return health
            end
            if condition.status == "True" and
              (condition.type == "Ready" or condition.type == "Healthy" or
               condition.type == "Established" or condition.type == "Installed" or
               condition.type == "RevisionHealthy") then
              health.status = "Healthy"
              health.message = condition.message or "Resource is ready"
            end
            if condition.type == "Established" and condition.reason == "InactiveManagedResource" then
              health.status = "Healthy"
              health.message = "Managed resource is intentionally inactive"
            end
          end
          return health
      "platform.example.org/*":
        health.lua: |
          local health = {
            status = "Progressing",
            message = "Waiting for composed Grafana resources"
          }
          if obj.status == nil or obj.status.conditions == nil then
            return health
          end
          for _, condition in ipairs(obj.status.conditions) do
            if condition.type == "Synced" and condition.status == "False" then
              health.status = "Degraded"
              health.message = condition.message or condition.reason
              return health
            end
            if condition.type == "Ready" and condition.status == "True" then
              health.status = "Healthy"
              health.message = condition.message or "All composed resources are ready"
            end
          end
          return health
    resource.exclusions: |
      - apiGroups:
          - "*"
        kinds:
          - ProviderConfigUsage
