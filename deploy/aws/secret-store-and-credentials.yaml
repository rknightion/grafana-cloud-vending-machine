apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana-vending-secrets
  namespace: grafana-vending
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    aws:
      service: SecretsManager
      # Change this to the region containing your secrets.
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-org-credentials
  namespace: grafana-vending
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-vending-secrets
    kind: SecretStore
  target:
    name: grafana-cloud-org-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        credentials: |
          {"cloud_access_policy_token": {{ .cloudAccessPolicyToken | toJson }}}
  data:
    - secretKey: cloudAccessPolicyToken
      remoteRef:
        key: /platform/grafana-cloud/organization/credentials
        property: cloud_access_policy_token
---
apiVersion: grafana.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: grafana-cloud-org
  namespace: grafana-vending
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: Secret
    secretRef:
      name: grafana-cloud-org-credentials
      namespace: grafana-vending
      key: credentials
