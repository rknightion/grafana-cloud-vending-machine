apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is an opt-in consumer overlay. The default platform base does not
# include this directory, so it remains inert until a consumer selects it.
resources:
  - ../../platform

patches:
  - path: provider-runtime-metrics-patch.yaml
    target:
      group: pkg.crossplane.io
      version: v1beta1
      kind: DeploymentRuntimeConfig
      name: grafana-provider-runtime
