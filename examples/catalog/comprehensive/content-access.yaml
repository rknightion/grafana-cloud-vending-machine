apiVersion: platform.example.org/v1beta1
kind: GrafanaContentAccessPolicy
metadata:
  name: example-billing-folder-access
  namespace: grafana-vending
spec:
  stackRef:
    name: replacewithunique02
  target:
    kind: Folder
    ref:
      # Baseline provider Folder objects are named STACK-SLUG-billing.
      name: replacewithunique02-billing
  # This is the complete permission set for the target. Never create a second
  # GrafanaContentAccessPolicy for the same external Folder.
  permissions:
    - basicRole: Viewer
      permission: View
    - teamRef:
        # GrafanaTeamAccess creates a Team named CLAIM-NAME-team.
        name: example-observability-engineers-team
      permission: Edit
---
apiVersion: platform.example.org/v1beta1
kind: GrafanaContentAccessPolicy
metadata:
  name: example-home-dashboard-access
  namespace: grafana-vending
spec:
  stackRef:
    name: replacewithunique02
  target:
    kind: Dashboard
    ref:
      name: replacewithunique02-homepage
  permissions:
    - basicRole: Viewer
      permission: View
    - teamRef:
        name: example-observability-engineers-team
      permission: Edit
